<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>심플예약</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e5d4b">
</head>
<body>
  <header class="bar">
    <h1>심플예약</h1>
    <span class="header-actions">
      <a class="nav-link" href="customers.html">손님</a>
      <a class="nav-link" href="settings.html">설정</a>
    </span>
  </header>

  <div class="cal">
    <div class="cal-head">
      <button type="button" id="prevMonth" aria-label="지난달">‹</button>
      <span id="calTitle"></span>
      <button type="button" id="nextMonth" aria-label="다음달">›</button>
    </div>
    <div class="cal-week">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <main id="list"></main>

  <dialog id="addDialog">
    <form id="addForm" method="dialog">
      <div class="field">
        <label for="f-date">날짜</label>
        <input type="date" id="f-date" required>
      </div>

      <div class="field">
        <label for="f-time">시각</label>
        <input type="time" id="f-time" step="600" required>
      </div>

      <div class="field">
        <label for="f-service">시술</label>
        <select id="f-service"></select>
      </div>

      <div class="field">
        <label for="f-duration">예상 시간</label>
        <div class="duration">
          <button type="button" id="f-minus" aria-label="10분 줄이기">−</button>
          <output id="f-duration">90분</output>
          <button type="button" id="f-plus" aria-label="10분 늘리기">+</button>
        </div>
      </div>

      <div class="field">
        <label for="f-name">손님 이름 (선택)</label>
        <input type="text" id="f-name" list="knownNames" autocomplete="off">
        <datalist id="knownNames"></datalist>
      </div>

      <div class="dialog-actions">
        <button type="button" id="f-cancel">닫기</button>
        <button type="submit" id="f-save">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="actionDialog">
    <p id="actionTarget" class="action-target"></p>
    <div class="action-list">
      <button type="button" id="actCancel">취소로 표시</button>
      <button type="button" id="actRestore">되살리기</button>
      <button type="button" id="actDelete">완전히 지우기</button>
      <button type="button" id="actClose">닫기</button>
    </div>
  </dialog>

  <button id="addBtn" class="fab">+ 직접 추가</button>

  <!-- 서비스 워커 등록. home.js 안이 아니라 여기서 하는 이유:
       home.js 가 오류로 죽어도 이 줄은 살아 있어야, 다음 접속 때 앱이
       스스로 새 버전을 받아 고칠 수 있다. 안 그러면 한 번 깨진 폰은 영영 못 고친다. -->
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js')
  </script>

  <script type="module" src="js/home.js"></script>
</body>
</html>
